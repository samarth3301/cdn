version: '3.8'

services:
  s3-cdn-network:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "9876"
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cdn

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-161-118-169-11.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - s3-cdn-network
    restart: unless-stopped
    networks:
      - cdn

networks:
  cdn:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
